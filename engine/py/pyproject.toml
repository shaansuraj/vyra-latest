[project]
name = "indexer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.26.0",
    "pyarrow>=21.0.0",
    "pandas>=2.3.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.6.0",
    "num2words>=0.5.14",
    "timm>=1.0.19",
    "accelerate>=1.10.1",
    "transformers>=4.57.3",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "openai>=1.102.0",
    "python-dotenv>=1.0.1",
    "peft>=0.15.2",
    "pillow>=11.0.0",
    "websockets>=15.0.1",
    "opencv-python>=4.10.0",
    # InsightFace uses ONNX Runtime; use GPU provider on Linux.
    "onnxruntime-gpu>=1.20.0; sys_platform == 'linux'",
    "onnxruntime>=1.20.0; sys_platform != 'linux'",
    "cbor2>=5.7.1",
    "backoff>=2.2.1",
    "av>=13.2.0",
    "decord>=0.6.0",
    "pycocotools>=2.0.10",
    "ultralytics>=8.1.0",
    "ultralyticsplus",
    "insightface",
    "torchreid>=0.2.5",
    "msgpack==1.1.2",
    "websocket-client>=1.6.0",
    "supervision>=0.25.0",
    "gdown>=6.1.0",
    "tensorboard>=2.21.0",
]

# PyTorch CUDA wheels index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Optional CPU index if needed
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",    marker = "sys_platform == 'darwin'" },
]
# Use local transformers clone for SAM3 support (not yet in released version)
transformers = { path = "transformers", editable = true }
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",    marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",    marker = "sys_platform == 'darwin'" },
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "FALSE" }
