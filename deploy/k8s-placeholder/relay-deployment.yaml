apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: vyra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/your-org/vyra-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
              name: http
            - containerPort: 7001
              name: worker-ws
          env:
            - name: APP_ENV
              value: production
            - name: APP_DIR
              value: /data
            - name: LLM_WORKER_URL
              value: http://llm-worker:5003
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: relay-data
              mountPath: /data
      volumes:
        - name: relay-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: vyra
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 8020
      targetPort: http
    - name: worker-ws
      port: 7001
      targetPort: worker-ws

