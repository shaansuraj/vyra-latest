apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: vyra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: ghcr.io/your-org/vyra-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_RELAY_BASE_URL
              value: http://relay:8020
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: vyra
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 5173
      targetPort: http

